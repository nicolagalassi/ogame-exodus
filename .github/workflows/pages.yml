# Publishes the merged Exodus rankings on GitHub Pages.
# fetch.mjs reads the official public OGame API - highscore files that Gameforge regenerates about once an
# hour - so a run every 3 hours is plenty; nothing polls the game more often than that (AGENTS.md 6).
# About 330 universes, six at a time and one request at a time per server: a run takes a few minutes.
# data/ is built here and deployed, never committed.
name: Exodus rankings on Pages

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['index.html', 'fetch.mjs', 'merges.mjs', '.github/workflows/pages.yml']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: exodus-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download the public API files
        run: node fetch.mjs
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r index.html data _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
