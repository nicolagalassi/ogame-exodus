<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1626">
<title>Exodus - classifiche unite</title>
<!-- Data: data.js, written by fetch.mjs from the official public OGame API. Rebuild with `node fetch.mjs`. -->
<script src="data.js"></script>
<style>
    :root
    {
        --bg:#0f1626; --panel:#16203a; --panel-2:#1b2744; --line:#2a3a5c; --ink:#e6ecf7; --muted:#9aa8c3; --faint:#6f7e9c;
        --accent:var(--group, #5aa9f0);
    }
    *{ box-sizing:border-box; }
    body{ margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main{ max-width:1100px; margin:0 auto; padding:28px 20px 60px; }
    h1{ margin:0 0 4px; font-size:22px; font-weight:650; }
    .sub{ color:var(--muted); margin:0 0 22px; }

    .groups{ display:grid; grid-template-columns:repeat(auto-fit, minmax(250px, 1fr)); gap:10px; margin-bottom:18px; }
    .group{ all:unset; cursor:pointer; padding:12px 14px; background:var(--panel); border:1px solid var(--line); border-left:0; border-radius:8px;
        box-shadow:inset 3px 0 0 var(--c); transition:border-color .15s ease-out, background .15s ease-out; }
    @media (hover:hover){ .group:hover{ background:var(--panel-2); } }
    .group:focus-visible{ outline:2px solid var(--c); outline-offset:2px; }
    .group[aria-pressed="true"]{ border-color:var(--c); background:var(--panel-2); }
    .group b{ display:block; font-size:15px; color:var(--c); }
    .group .dot{ display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:5px; vertical-align:1px; }
    .hint{ color:var(--muted); font-size:13px; }
    .group span{ display:block; color:var(--muted); font-size:12.5px; margin-top:2px; }

    .bar{ display:flex; flex-wrap:wrap; align-items:center; gap:10px 14px; margin-bottom:12px; }
    .tabs{ display:inline-flex; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:3px; }
    .tabs button{ all:unset; cursor:pointer; padding:6px 13px; border-radius:6px; color:var(--muted); font-weight:550; }
    .tabs button:hover{ color:var(--ink); }
    .tabs button:focus-visible{ outline:2px solid var(--accent); }
    .tabs button[aria-pressed="true"]{ background:var(--accent); color:#0b1220; }
    input[type=search]{ flex:1 1 220px; min-width:180px; padding:8px 11px; background:var(--panel); border:1px solid var(--line); border-radius:8px; color:var(--ink); font:inherit; }
    input[type=search]:focus{ outline:none; border-color:var(--accent); }
    label.check{ display:inline-flex; align-items:center; gap:7px; color:var(--muted); cursor:pointer; user-select:none; }
    label.check input{ accent-color:var(--accent); }

    .chips{ display:flex; flex-wrap:wrap; gap:6px; margin:0 0 12px; }
    .chip{ all:unset; cursor:pointer; padding:3px 10px; border:1px solid var(--line); border-radius:999px; color:var(--muted); font-size:12.5px; }
    .chip:focus-visible{ outline:2px solid var(--accent); }
    .chip[aria-pressed="true"]{ border-color:var(--accent); color:var(--ink); background:var(--panel-2); }
    .chip small{ color:var(--faint); margin-left:4px; }

    .summary{ color:var(--muted); font-size:13px; margin:0 0 8px; }
    table{ width:100%; border-collapse:collapse; background:var(--panel); border:1px solid var(--line); border-radius:8px; overflow:hidden; }
    th, td{ padding:7px 12px; text-align:left; border-bottom:1px solid var(--line); white-space:nowrap; }
    th{ position:sticky; top:0; background:var(--panel-2); color:var(--muted); font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.03em; }
    td.num, th.num{ text-align:right; font-variant-numeric:tabular-nums; }
    @media (hover:hover){ tbody tr:hover{ background:var(--panel-2); } }
    td.rank{ color:var(--faint); width:1%; }
    tr.top td.rank{ color:var(--accent); font-weight:700; }
    td.name{ font-weight:550; }
    /* on a phone the alliance, universe and original position move under the name, see below */
    td.name .meta{ display:none; }
    .ally{ color:var(--muted); }
    .uni{ color:var(--muted); }
    .uni em{ font-style:normal; color:var(--faint); margin-left:6px; }
    .flag{ display:inline-block; margin-left:6px; padding:0 5px; border-radius:4px; font-size:11px; font-weight:700; line-height:16px; vertical-align:1px; background:#2b3550; color:var(--muted); }
    .flag.v{ background:#24405f; color:#9ccbff; }
    .flag.i, .flag.I{ background:#3d3523; color:#e7c27a; }
    .flag.b{ background:#4a2328; color:#ff9b9b; }
    .more{ display:block; margin:14px auto 0; padding:8px 18px; background:var(--panel); color:var(--ink); border:1px solid var(--line); border-radius:8px; font:inherit; cursor:pointer; }
    .more:hover{ border-color:var(--accent); }
    .empty{ padding:40px 20px; text-align:center; color:var(--muted); background:var(--panel); border:1px solid var(--line); border-radius:8px; }
    .empty code{ color:var(--ink); }
    footer{ margin-top:22px; color:var(--faint); font-size:12px; }

    .specs{ display:grid; grid-template-columns:repeat(auto-fit, minmax(300px, 1fr)); gap:10px; margin:0 0 18px; }
    .spec{ padding:12px 14px; background:var(--panel); border:1px solid var(--line); border-radius:8px; }
    .spec summary{ cursor:pointer; list-style:none; font-size:14px; }
    .spec summary::-webkit-details-marker{ display:none; }
    .spec summary::before{ content:'▸'; display:inline-block; width:14px; color:var(--muted); transition:transform .15s ease-out; }
    .spec[open] summary::before{ transform:rotate(90deg); }
    .spec summary span{ margin-left:6px; color:var(--muted); font-size:12px; }
    .spec summary em{ display:block; margin:3px 0 0 14px; font-style:normal; color:var(--muted); font-size:12px; }
    .spec[open] summary em{ display:none; }
    .spec[open] summary{ margin-bottom:9px; }
    @media (prefers-reduced-motion:reduce){ .spec summary::before{ transition:none; } }
    @media (pointer:coarse){ .spec summary{ min-height:44px; display:flex; flex-wrap:wrap; align-items:center; } .spec summary em{ flex-basis:100%; } }
    .spec dl{ display:grid; grid-template-columns:repeat(auto-fill, minmax(88px, 1fr)); gap:6px; margin:0; }
    .spec dl div{ padding:6px 8px; background:var(--bg); border-radius:6px; }
    .spec dt{ color:var(--muted); font-size:11px; }
    .spec dd{ margin:1px 0 0; font-weight:650; font-variant-numeric:tabular-nums; }
    .specNote{ grid-column:1 / -1; margin:0; color:var(--muted); font-size:12px; }
    /* the settings every destination shares: once under the cards on a wide screen, inside each card on a
       phone, where the cards start closed and four lines of it would otherwise push the ranking down */
    .specCommon{ display:none; margin:9px 0 0; color:var(--muted); font-size:12px; }
    @media (max-width:640px){ .specNote{ display:none; } .specCommon{ display:block; } }
    @media (max-width:640px){ th.opt, td.opt{ display:none; } }

    /* ---- Phone. Rethought rather than shrunk: the ranking is what people come for, so everything above it
       gets shorter, every control fits a thumb (44px), nothing scrolls sideways except rows that are meant
       to, and the table loses columns instead of width. ---- */
    @media (max-width:640px)
    {
        main{ padding:16px max(12px, env(safe-area-inset-right)) max(40px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left)); }
        h1{ font-size:19px; }
        .sub{ font-size:13px; margin-bottom:14px; }
        .bar{ gap:8px; }
        .hint{ font-size:12px; }

        /* group / destination: one row that scrolls, snapping card by card, instead of a tall stack */
        .groups{ display:flex; gap:8px; overflow-x:auto; scroll-snap-type:x mandatory; margin:0 -12px 14px; padding:2px 12px 6px; scrollbar-width:none; }
        .groups::-webkit-scrollbar{ display:none; }
        .group{ flex:0 0 auto; width:min(76%, 250px); scroll-snap-align:start; padding:10px 12px; }
        .group b{ font-size:14px; }
        .group span{ font-size:12px; }

        /* segmented controls: full width; the five rankings scroll sideways if they do not fit */
        .tabs{ display:flex; width:100%; overflow-x:auto; scrollbar-width:none; }
        .tabs::-webkit-scrollbar{ display:none; }
        .tabs button{ flex:1 0 auto; min-height:44px; display:flex; align-items:center; justify-content:center; padding:0 12px; }
        #views button{ flex:1 1 0; }

        /* 16px keeps iOS from zooming into the field */
        input[type=search]{ flex:1 1 100%; min-height:44px; font-size:16px; }
        label.check{ min-height:44px; }

        .chips{ flex-wrap:nowrap; overflow-x:auto; margin:0 -12px 10px; padding:0 12px 4px; scrollbar-width:none; }
        .chips::-webkit-scrollbar{ display:none; }
        .chip{ flex:0 0 auto; display:flex; align-items:center; min-height:40px; padding:0 13px; font-size:13px; }

        /* the table keeps three columns: rank, player (with alliance, universe and original position
           under the name) and points */
        th.wide, td.wide{ display:none; }
        td.name .meta{ display:block; margin-top:2px; font-weight:400; font-size:12px; color:var(--muted); white-space:normal; }
        td.name .meta em{ font-style:normal; color:var(--faint); }
        th, td{ padding:9px 8px; }
        td.name{ white-space:normal; overflow-wrap:anywhere; }
        td.num{ font-size:13px; }
        .ships{ display:block; font-size:11.5px; color:var(--faint); }
        .more{ width:100%; min-height:48px; }
    }
    @media (min-width:641px){ .ships{ display:none; } }
    /* a phone held sideways: little height, so the header shrinks and the settings cards stay closed */
    @media (max-height:500px)
    {
        main{ padding-top:12px; }
        .sub, .hint{ display:none; }
        h1{ margin-bottom:10px; font-size:18px; }
        .groups{ margin-bottom:10px; }
        .group span:last-child{ display:none; }
        .specs{ margin-bottom:10px; }
        .spec{ padding:2px 12px; }
        .spec[open]{ padding-bottom:10px; }
        .spec summary em, .specNote{ display:none; }
        .specCommon{ display:block; }
        input[type=search]{ min-width:140px; }
        .bar{ gap:8px; margin-bottom:8px; }
    }
    /* touch at any width (a phone held sideways is wider than 640px): thumb-sized controls, and 16px in the
       search field so iOS does not zoom */
    @media (pointer:coarse)
    {
        .tabs button{ min-height:44px; display:inline-flex; align-items:center; }
        .chip{ min-height:40px; display:inline-flex; align-items:center; padding:0 13px; }
        input[type=search]{ min-height:44px; font-size:16px; }
        label.check{ min-height:44px; }
        .more{ min-height:48px; }
    }
</style>
</head>
<body>
<main>
    <h1>Exodus: classifiche unite</h1>
    <p class="sub">I giocatori degli universi che si fondono, in un'unica classifica per gruppo o per universo di destinazione. Dati dall'API pubblica di OGame.</p>

    <div class="bar">
        <div class="tabs" id="views" role="group" aria-label="Unisci per">
            <button data-view="group">Per gruppo</button>
            <button data-view="destination">Per destinazione</button>
        </div>
        <span class="hint" id="hint"></span>
    </div>

    <div class="groups" id="groups" role="group" aria-label="Classifica unita"></div>
    <div class="specs" id="specs"></div>

    <div class="bar">
        <div class="tabs" id="tabs" role="group" aria-label="Classifica"></div>
        <input type="search" id="search" placeholder="Cerca giocatore o alleanza" aria-label="Cerca giocatore o alleanza">
        <label class="check"><input type="checkbox" id="active"> Nascondi inattivi e bannati</label>
    </div>

    <div class="chips" id="chips" role="group" aria-label="Universi"></div>
    <p class="summary" id="summary"></p>
    <div id="table"></div>
    <footer id="footer"></footer>
</main>

<script>
(() =>
{
    'use strict';

    const data = window.EXODUS_DATA;
    const $ = id => document.getElementById(id);

    if(!data)
    {
        $('table').innerHTML = '<div class="empty">Nessun dato. Esegui <code>node fetch.mjs</code> e ricarica la pagina.</div>';
        return;
    }

    // [id, name, status, alliance, total, totalPos, economy, economyPos, research, researchPos, military, militaryPos, ships, lifeform, lifeformPos]
    const CATEGORIES =
    [
        { key:'total', label:'Generale', score:4, pos:5 },
        { key:'economy', label:'Economia', score:6, pos:7 },
        { key:'research', label:'Ricerca', score:8, pos:9 },
        { key:'military', label:'Militare', score:10, pos:11, ships:12 },
        { key:'lifeform', label:'Forme di vita', score:13, pos:14 },
    ];
    const FLAGS = { v:'in vacanza', i:'inattivo da 7 giorni', I:'inattivo da 28 giorni', b:'bannato', o:'fuorilegge' };
    const PAGE = 250;

    const fmt = new Intl.NumberFormat('it-IT');
    const esc = text => String(text).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));

    // The two ways of merging. A group is a fixed set of source universes. A destination takes every group
    // that can move there, so Zhang and Astrid draw on two groups and a player shows up under both of the
    // destinations their group can choose.
    const SETS =
    {
        group:data.groups.map(g => ({ id:g.id, title:`Gruppo ${g.name}`, label:`del gruppo ${g.name}`, colors:[g.color], universes:g.universes,
            note:`Destinazioni: ${g.destinations.join(', ')}` })),
        destination:[...new Set(data.groups.flatMap(g => g.destinations))]
            .sort((a, b) => Number(a.match(/\d+/)) - Number(b.match(/\d+/)))
            .map(d =>
            {
                const from = data.groups.filter(g => g.destinations.includes(d));
                return { id:d, title:d, label:`di ${d.replace(/\s*\(.*/, '')}`, colors:from.map(g => g.color), universes:from.flatMap(g => g.universes),
                    note:`Da: gruppo ${from.map(g => g.name).join(' + ')}` };
            }),
    };
    // The destination universes do not exist yet, so the API has nothing on them: these are the announced
    // settings, typed in by hand. Keys match the destination names in data.groups.
    const SPEC_FIELDS = [ ['economy', 'Economia'], ['research', 'Ricerca'], ['peaceful', 'Flotta pacifica'], ['holding', 'Stazionamento'],
        ['hostile', 'Flotta ostile'], ['galaxies', 'Galassie'], ['debris', 'Detriti'], ['defenceDebris', 'Difese nei detriti'],
        ['fields', 'Campi extra'], ['deut', 'Consumo deuterio'], ['dm', 'Materia Oscura'] ];
    const SPEC_COMMON = 'ACS ON · galassie e sistemi circolari · sonde con stiva ON · deuterio nei detriti ON · ignora sistemi vuoti e inattivi per tempi e consumi del volo ON.';
    const SPECS =
    {
        'Zhang (IT 281)':    { style:'Miner',    economy:'x10', research:'x20', peaceful:'x2', holding:'x2', hostile:'x1', galaxies:'8', debris:'50%', defenceDebris:'0%', fields:'+30', deut:'0,5x', dm:'8.000' },
        'Astrid (IT 282)':   { style:'Balanced', economy:'x10', research:'x20', peaceful:'x5', holding:'x3', hostile:'x2', galaxies:'8', debris:'50%', defenceDebris:'0%', fields:'+25', deut:'0,5x', dm:'8.000' },
        'Buzz (IT 283)':     { style:'Fleeter',  economy:'x10', research:'x20', peaceful:'x6', holding:'x4', hostile:'x3', galaxies:'8', debris:'50%', defenceDebris:'0%', fields:'+25', deut:'0,5x', dm:'25.000' },
        'Celestia (IT 284)': { style:'Balanced', economy:'x10', research:'x20', peaceful:'x4', holding:'x2', hostile:'x2', galaxies:'8', debris:'50%', defenceDebris:'0%', fields:'+30', deut:'0,5x', dm:'25.000' },
    };

    // the destinations relevant to what is selected: the one chosen, or the two a group can move to
    const renderSpecs = () =>
    {
        const names = state.view === 'destination' ? [state.set] : data.groups.find(g => g.id === state.set).destinations;
        // open only where there is room: not on a phone, upright or held sideways
        const open = matchMedia('(min-width:641px) and (min-height:501px)').matches;
        $('specs').innerHTML = names.filter(n => SPECS[n]).map(n =>
        {
            const spec = SPECS[n];
            // closed on a phone, so the ranking stays near the top; the summary carries what sets the
            // destinations apart (fleet speeds, holding time, extra fields, dark matter)
            return `<details class="spec"${open ? ' open' : ''}><summary><b>${esc(n)}</b> <span>${esc(spec.style)}</span>` +
                `<em>pacifica ${esc(spec.peaceful)} · ostile ${esc(spec.hostile)} · staz. ${esc(spec.holding)} · campi ${esc(spec.fields)} · MO ${esc(spec.dm)}</em></summary><dl>` +
                SPEC_FIELDS.map(([key, label]) => `<div><dt>${label}</dt><dd>${esc(spec[key])}</dd></div>`).join('') +
                `</dl><p class="specCommon">${esc(SPEC_COMMON)}</p></details>`;
        }).join('') + (names.some(n => SPECS[n]) ? `<p class="specNote">Tutte: ${esc(SPEC_COMMON)}</p>` : '');
    };

    const HINTS =
    {
        group:'Ogni giocatore compare una volta.',
        destination:'Tutti i giocatori che possono scegliere quella destinazione: chi ne ha due compare in entrambe.',
    };

    const state = { view:'group', set:SETS.group[0].id, category:'total', query:'', activeOnly:false, hidden:new Set(), shown:PAGE };

    const group = () => SETS[state.view].find(s => s.id === state.set);

    const renderGroups = () =>
    {
        $('views').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.view === state.view));
        $('hint').textContent = HINTS[state.view];
        $('groups').innerHTML = SETS[state.view].map(s =>
        {
            const players = s.universes.reduce((sum, n) => sum + (data.universes[n]?.players.length || 0), 0);
            const dots = s.colors.length > 1 ? s.colors.map(c => `<i class="dot" style="background:${c}"></i>`).join('') : '';
            return `<button class="group" style="--c:${s.colors[0]}" data-id="${esc(s.id)}" aria-pressed="${s.id === state.set}">` +
                `<b>${dots}${esc(s.title)}</b><span>${s.universes.length} universi, ${fmt.format(players)} giocatori</span>` +
                `<span>${esc(s.note)}</span></button>`;
        }).join('');
        document.documentElement.style.setProperty('--group', group().colors[0]);
        // on a phone the cards are a sideways strip: keep the chosen one on screen
        $('groups').querySelector('[aria-pressed="true"]')?.scrollIntoView({ block:'nearest', inline:'nearest' });
    };

    const renderTabs = () =>
    {
        $('tabs').innerHTML = CATEGORIES.map(c => `<button data-key="${c.key}" aria-pressed="${c.key === state.category}">${c.label}</button>`).join('');
    };

    const renderChips = () =>
    {
        $('chips').innerHTML = group().universes.map(n =>
        {
            const u = data.universes[n];
            return `<button class="chip" data-n="${n}" aria-pressed="${!state.hidden.has(n)}">${esc(u?.name || n)}<small>${n}</small></button>`;
        }).join('');
    };

    const rows = () =>
    {
        const category = CATEGORIES.find(c => c.key === state.category);
        const query = state.query.trim().toLowerCase();
        const list = [];

        for(const n of group().universes)
        {
            if(state.hidden.has(n)) continue;
            const universe = data.universes[n];
            if(!universe) continue;

            for(const p of universe.players)
            {
                if(state.activeOnly && /[iIb]/.test(p[2])) continue;
                list.push({ p, universe });
            }
        }

        // the merged order: score first, then the original position as a stable tie-break
        list.sort((a, b) => b.p[category.score] - a.p[category.score] || a.p[category.pos] - b.p[category.pos]);
        list.forEach((row, index) => row.rank = index + 1);

        const filtered = query ? list.filter(({ p }) => p[1].toLowerCase().includes(query) || p[3].toLowerCase().includes(query)) : list;
        return { category, all:list.length, list:filtered };
    };

    const renderTable = () =>
    {
        const { category, all, list } = rows();
        const shown = list.slice(0, state.shown);

        $('summary').textContent = state.query
            ? `${fmt.format(list.length)} risultati su ${fmt.format(all)} giocatori`
            : `${fmt.format(all)} giocatori nella classifica ${category.label.toLowerCase()} ${group().label}`;

        if(!list.length)
        {
            $('table').innerHTML = '<div class="empty">Nessun giocatore corrisponde ai filtri.</div>';
            return;
        }

        const flags = status => Array.from(status).filter(f => FLAGS[f]).map(f => `<span class="flag ${f}" title="${FLAGS[f]}">${f}</span>`).join('');

        $('table').innerHTML =
            `<table><thead><tr><th class="num">#</th><th>Giocatore</th><th class="wide">Alleanza</th><th class="wide">Universo</th><th class="num opt">Pos. originale</th>` +
            `<th class="num">Punti</th>${category.ships ? '<th class="num opt">Navi</th>' : ''}</tr></thead><tbody>` +
            shown.map(({ p, universe, rank }) =>
                `<tr class="${rank <= 10 ? 'top' : ''}"><td class="num rank">${rank}</td>` +
                `<td class="name">${esc(p[1])}${flags(p[2])}<span class="meta">${p[3] ? esc(p[3]) + ' · ' : ''}${esc(universe.name)} <em>${universe.number}` +
                (p[category.pos] ? `, ${fmt.format(p[category.pos])}°` : '') + `</em></span></td>` +
                `<td class="ally wide">${p[3] ? esc(p[3]) : ''}</td>` +
                `<td class="uni wide">${esc(universe.name)}<em>${universe.number}</em></td>` +
                `<td class="num opt">${p[category.pos] ? fmt.format(p[category.pos]) : ''}</td>` +
                `<td class="num">${fmt.format(p[category.score])}` +
                (category.ships ? `<span class="ships">${fmt.format(p[category.ships])} navi</span>` : '') + `</td>` +
                (category.ships ? `<td class="num opt">${fmt.format(p[category.ships])}</td>` : '') + `</tr>`).join('') +
            `</tbody></table>` +
            (list.length > shown.length ? `<button class="more" id="more">Mostra altri ${fmt.format(Math.min(PAGE, list.length - shown.length))} (${fmt.format(list.length - shown.length)} rimasti)</button>` : '');
    };

    const renderFooter = () =>
    {
        const stamps = group().universes.map(n => data.universes[n]?.updated).filter(Boolean);
        const when = t => new Date(t * 1000).toLocaleString('it-IT', { dateStyle:'short', timeStyle:'short' });
        $('footer').textContent = `Classifiche aggiornate da Gameforge tra ${when(Math.min(...stamps))} e ${when(Math.max(...stamps))}. ` +
            `Dati scaricati il ${new Date(data.generatedAt).toLocaleString('it-IT', { dateStyle:'short', timeStyle:'short' })}. ` +
            `Gli amministratori del gioco sono esclusi.`;
    };

    const render = () => { renderGroups(); renderSpecs(); renderTabs(); renderChips(); renderTable(); renderFooter(); };

    $('views').addEventListener('click', e =>
    {
        const button = e.target.closest('button');
        if(!button || button.dataset.view === state.view) return;
        state.view = button.dataset.view; state.set = SETS[state.view][0].id; state.hidden.clear(); state.shown = PAGE;
        render();
    });
    $('groups').addEventListener('click', e =>
    {
        const button = e.target.closest('.group');
        if(!button) return;
        state.set = button.dataset.id; state.hidden.clear(); state.shown = PAGE;
        render();
    });
    $('tabs').addEventListener('click', e =>
    {
        const button = e.target.closest('button');
        if(!button) return;
        state.category = button.dataset.key; state.shown = PAGE;
        renderTabs(); renderTable();
    });
    $('chips').addEventListener('click', e =>
    {
        const button = e.target.closest('.chip');
        if(!button) return;
        const n = Number(button.dataset.n);
        if(state.hidden.has(n)) state.hidden.delete(n);
        else if(state.hidden.size < group().universes.length - 1) state.hidden.add(n); // at least one stays
        state.shown = PAGE;
        renderChips(); renderTable();
    });
    $('search').addEventListener('input', e => { state.query = e.target.value; state.shown = PAGE; renderTable(); });
    $('active').addEventListener('change', e => { state.activeOnly = e.target.checked; state.shown = PAGE; renderTable(); });
    $('table').addEventListener('click', e => { if(e.target.id === 'more') { state.shown += PAGE; renderTable(); } });

    render();
})();
</script>
</body>
</html>
