<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0c0a">
<title>Fusioni OG 2026</title>
<!-- published on GitHub Pages and shown under ovalue.net/fusion/ through a Netlify proxy (ovalue's _redirects) -->
<link rel="canonical" href="https://ovalue.net/fusion/">
<!-- ovalue.net/fusion without the slash would resolve data/ against the site root: add the slash first -->
<script>if(location.pathname.endsWith('/fusion')) location.replace(location.pathname + '/' + location.search + location.hash);</script>
<!-- Data: data/, written by fetch.mjs from the official public OGame API. Rebuild with `node fetch.mjs`.
     data/index.js is the merge map and the universe list; each universe's players load when a ranking needs them. -->
<script src="data/index.js" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- fonts load without blocking the first paint; the fallbacks in --display/--text/--mono stand in meanwhile -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Big+Shoulders+Display:wght@700;800;900&family=Spline+Sans+Mono:wght@400;500;600&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Big+Shoulders+Display:wght@700;800;900&family=Spline+Sans+Mono:wght@400;500;600&display=swap"></noscript>
<style>
    /* A printed standings sheet rather than a dashboard: near-black, hairline rules instead of boxes,
       a condensed display face for names and ranks, a monospace for numbers and table headings. The only
       strong colours are the game's own: the group colours, the ranking colours, the status flags. */
    :root
    {
        --bg:#0d0c0a; --bg-2:#1a1812; --rule:#34312a; --rule-strong:#5e594c; --ink:#f4eee0; --muted:#c2baa8; --faint:#8f887a;
        --flag-v:#8fbcf0; --flag-i:#d9b36a; --flag-b:#f08a84;
        --accent:var(--group, #5aa9f0);
        --display:'Big Shoulders Display', 'Arial Narrow', sans-serif;
        --text:'Archivo', system-ui, sans-serif;
        --mono:'Spline Sans Mono', ui-monospace, monospace;
    }
    *{ box-sizing:border-box; }
    html{ background:var(--bg); }
    body{ margin:0; color:var(--ink); font:15px/1.45 var(--text); -webkit-font-smoothing:antialiased; }
    .sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap; }
    ::selection{ background:var(--accent); color:var(--bg); }
    main, body > footer{ max-width:1120px; margin:0 auto; padding:34px 24px 64px; }

    /* the way back to OValue, which shows this page under /fusion/, on the line of the language switch */
    .home{ display:inline-block; margin:0 0 14px; font:600 12px/1 var(--mono); letter-spacing:.08em; text-transform:uppercase; color:var(--muted); text-decoration:none; }
    .home:hover{ color:var(--ink); }
    .home:focus-visible{ outline:1px solid var(--ink); outline-offset:3px; }
    /* the language switch sits in the top corner of the masthead */
    .mast .lang{ position:absolute; top:-8px; right:0; width:auto; gap:14px; }
    .mast .lang button{ font:600 12px/1 var(--mono); letter-spacing:.08em; }
    .mast{ position:relative; padding-bottom:18px; margin-bottom:22px; border-bottom:2px solid var(--accent); transition:border-color .3s ease-out; }
    .kicker{ margin:0 0 10px; font:500 12px/1 var(--mono); letter-spacing:.12em; text-transform:uppercase; color:var(--muted); }
    h1{ margin:0; font:900 clamp(60px, 10vw, 96px)/.82 var(--display); letter-spacing:-.005em; text-transform:uppercase; text-wrap:balance; }
    h1 span{ display:block; margin-top:.24em; font-size:.3em; font-weight:700; letter-spacing:.12em; color:var(--accent); transition:color .3s ease-out; }
    @media (prefers-reduced-motion:no-preference)
    {
        .mast > *{ animation:rise .7s cubic-bezier(.2, .7, .2, 1) both; }
        .mast > :nth-child(2){ animation-delay:.06s; }
        @keyframes rise{ from{ opacity:0; transform:translateY(14px); } }
    }

    .bar{ display:flex; flex-wrap:wrap; align-items:center; gap:10px 22px; margin-bottom:14px; }
    .hint{ color:var(--muted); font-size:13.5px; }
    .tabs{ display:inline-flex; gap:22px; }
    .tabs button{ all:unset; cursor:pointer; padding:8px 0 6px; border-bottom:2px solid transparent; color:var(--muted);
        font:600 14.5px/1 var(--text); transition:color .15s ease-out, border-color .15s ease-out; }
    .tabs button:hover{ color:var(--ink); }
    .tabs button:focus-visible{ outline:1px solid var(--ink); outline-offset:3px; }
    .tabs button[aria-pressed="true"]{ color:var(--ink); border-color:var(--accent); }
    /* the communities: short codes in the monospace, wrapping on a wide screen */
    #comms{ flex-wrap:wrap; gap:4px 16px; }
    #comms button{ font:600 13px/1 var(--mono); letter-spacing:.06em; }

    /* the groups (or destinations) as columns of the sheet; the chosen one gets its colour bar on top,
       split in two for a destination fed by two groups */
    /* hairlines between the columns: each column draws one to its left, and the container clips the one of
       whichever column starts a row, so a column that wraps never carries a stray border */
    .groups{ display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); margin:0 0 26px; overflow:hidden; border-top:1px solid var(--rule-strong); border-bottom:1px solid var(--rule); }
    .group{ all:unset; position:relative; cursor:pointer; padding:16px 18px 15px; box-shadow:-1px 0 0 var(--rule); color:var(--muted); transition:color .2s ease-out, background .2s ease-out; }
    .group::before{ content:''; position:absolute; left:0; right:0; top:-1px; height:4px; background:var(--bar); transform:scaleX(0); transform-origin:left; transition:transform .3s cubic-bezier(.2, .7, .2, 1); }
    @media (hover:hover){ .group:hover{ color:var(--ink); background:var(--bg-2); } }
    .group:focus-visible{ outline:2px solid var(--c); outline-offset:-2px; }
    .group[aria-pressed="true"]{ color:var(--ink); background:color-mix(in srgb, var(--c) 8%, var(--bg)); }
    .group[aria-pressed="true"]::before{ transform:scaleX(1); }
    .group b{ display:flex; align-items:center; gap:10px; margin:0 0 9px; font:800 42px/.9 var(--display); text-transform:uppercase; }
    .group .sw{ display:inline-flex; gap:3px; }
    .group .sw i{ width:10px; height:10px; background:var(--sw); }
    .group .sw i.foreign{ background:none; box-shadow:inset 0 0 0 2px var(--sw); }
    .group > span{ display:block; color:var(--muted); font-size:13px; }
    .group > span + span{ color:var(--faint); }
    .group[aria-pressed="true"] > span + span{ color:var(--muted); }

    /* the announced settings of the destinations, closed by default */
    .specs{ display:grid; grid-template-columns:repeat(auto-fit, minmax(300px, 1fr)); gap:0 32px; margin:0 0 20px; }
    .spec{ padding:10px 0; border-top:1px solid var(--rule); border-bottom:1px solid var(--rule); }
    .spec summary{ display:flex; align-items:center; gap:10px; cursor:pointer; list-style:none; }
    .spec summary::-webkit-details-marker{ display:none; }
    .spec summary::before{ content:'+'; flex:0 0 auto; width:14px; font:500 16px/1 var(--mono); color:var(--muted); transition:transform .2s ease-out; }
    .spec[open] summary::before{ transform:rotate(45deg); }
    .specHead{ flex:1; min-width:0; }
    .specTitle b{ font:700 22px/1.1 var(--display); text-transform:uppercase; letter-spacing:.01em; }
    .specTitle > span{ margin-left:8px; font:600 13px/1 var(--text); color:var(--accent); }
    .spec summary em{ display:block; margin-top:3px; font-size:12.5px; font-style:normal; color:var(--muted); }
    .spec[open] summary em{ display:none; }
    .spec[open] summary{ margin-bottom:12px; }
    .specToggle{ flex:0 0 auto; font:600 13px/1 var(--text); font-style:normal; color:var(--muted); white-space:nowrap; }
    .specToggle::after{ content:attr(data-show); }
    .spec[open] .specToggle::after{ content:attr(data-close); }
    @media (hover:hover){ .spec summary:hover .specToggle, .spec summary:hover::before{ color:var(--ink); } }
    @media (prefers-reduced-motion:reduce){ *, *::before, *::after{ transition:none !important; animation:none !important; } }
    @media (pointer:coarse){ .spec summary{ min-height:44px; } }
    .spec dl{ display:grid; grid-template-columns:repeat(auto-fill, minmax(92px, 1fr)); gap:12px 0; margin:0; }
    .spec dl div{ padding:0 10px; border-left:1px solid var(--rule); }
    .spec dt{ color:var(--muted); font-size:12px; }
    .spec dd{ margin:2px 0 0; font:600 15px/1.2 var(--mono); }
    /* the settings every destination shares, inside each card, so nothing is left outside when closed */
    .specCommon{ margin:12px 0 0; color:var(--faint); font-size:12.5px; }

    /* rankings in the game's own colours: points yellow, economy grey, research green, military red,
       lifeform purple, as the mark before the name and the underline of the chosen one */
    .controls{ padding-top:2px; border-top:1px solid var(--rule-strong); }
    #tabs{ gap:20px; }
    #tabs button{ padding:12px 0 10px; border-bottom-width:3px; }
    #tabs button::before{ content:''; display:inline-block; width:7px; height:7px; margin-right:8px; background:var(--cat); vertical-align:1px; opacity:.75; }
    #tabs button[aria-pressed="true"]{ border-color:var(--cat); }
    #tabs button[aria-pressed="true"]::before{ opacity:1; }
    input[type=search]{ flex:1 1 220px; min-width:180px; padding:9px 0; background:transparent; border:0; border-bottom:1px solid var(--rule-strong); border-radius:0; color:var(--ink); font:inherit; }
    input[type=search]::placeholder{ color:var(--faint); }
    input[type=search]:focus{ outline:none; border-color:var(--accent); }
    label.check{ display:inline-flex; align-items:center; gap:9px; color:var(--muted); font-size:13.5px; cursor:pointer; user-select:none; }
    label.check:hover{ color:var(--ink); }
    label.check input{ appearance:none; flex:0 0 auto; width:15px; height:15px; margin:0; border:1px solid var(--rule-strong); cursor:pointer; transition:background .15s ease-out, border-color .15s ease-out; }
    label.check input:checked{ background:var(--accent); border-color:var(--accent); box-shadow:inset 0 0 0 3px var(--bg); }
    label.check input:focus-visible{ outline:1px solid var(--ink); outline-offset:2px; }

    /* universes: a struck-through name is left out of the ranking */
    .chips{ display:flex; flex-wrap:wrap; gap:6px; margin:4px 0 18px; }
    .chip{ all:unset; cursor:pointer; padding:4px 9px; border:1px solid var(--rule); color:var(--faint); font-size:13.5px; text-decoration:line-through; text-decoration-color:var(--rule-strong); transition:color .15s ease-out, border-color .15s ease-out; }
    .chip:hover{ color:var(--muted); }
    .chip:focus-visible{ outline:1px solid var(--ink); outline-offset:2px; }
    .chip[aria-pressed="true"]{ border-color:var(--rule-strong); color:var(--ink); text-decoration:none; }
    .chip small{ margin-left:6px; font:400 12px var(--mono); color:var(--faint); }
    .chip.gone{ cursor:default; border-style:dashed; color:var(--faint); text-decoration:none; }

    .summary{ margin:0 0 6px; font-size:13.5px; color:var(--muted); }
    /* fixed columns, so filtering (fewer or shorter names) never moves alliance, universe or points */
    table{ width:100%; border-collapse:separate; border-spacing:0; table-layout:fixed; }
    th.c-rank{ width:64px; } th.c-ally{ width:15%; } th.c-uni{ width:18%; } th.c-pos{ width:12%; } th.c-pts{ width:16%; } th.c-ships{ width:14%; }
    td{ overflow:hidden; text-overflow:ellipsis; }
    th, td{ padding:8px 12px; text-align:left; border-bottom:1px solid var(--rule); white-space:nowrap; }
    th:first-child, td:first-child{ padding-left:0; }
    th:last-child, td:last-child{ padding-right:0; }
    th{ position:sticky; top:0; z-index:1; padding-top:12px; background:var(--bg); border-bottom-color:var(--rule-strong); color:var(--muted); font:600 11.5px/1 var(--mono); letter-spacing:.1em; text-transform:uppercase; overflow:hidden; text-overflow:ellipsis; }
    td.num, th.num{ text-align:right; }
    td.num{ font:500 14px/1.2 var(--mono); font-variant-numeric:tabular-nums; }
    @media (hover:hover){ tbody tr:hover{ background:var(--bg-2); } }
    td.rank{ padding-right:18px; color:var(--muted); font:700 20px/1 var(--display); text-overflow:clip; }
    tr.top td.rank{ color:var(--ink); }
    tr.podium td{ padding-top:13px; padding-bottom:13px; }
    tr.podium td.rank{ color:var(--accent); font-size:34px; font-weight:900; }
    tr.podium td.name{ font-size:17px; }
    td.name{ font-weight:600; }
    td.points{ color:var(--ink); font-weight:600; }
    /* on a phone the alliance, universe and original position move under the name, see below */
    td.name .meta{ display:none; }
    .ally{ color:var(--muted); }
    .uni{ color:var(--muted); }
    .uni em, td.opt{ color:var(--faint); }
    .uni em{ margin-left:6px; font:400 12px var(--mono); font-style:normal; }
    .flag{ display:inline-block; margin-left:7px; padding:0 4px; border:1px solid currentColor; font:600 11px/15px var(--mono); vertical-align:2px; color:var(--muted); }
    .flag.v{ color:var(--flag-v); }
    .flag.i, .flag.I{ color:var(--flag-i); }
    .flag.b{ color:var(--flag-b); }
    .more{ display:block; width:100%; margin:0; padding:14px; background:transparent; color:var(--muted); border:0; border-bottom:1px solid var(--rule-strong); font:600 14px/1 var(--text); cursor:pointer; }
    .more:focus-visible{ outline:2px solid var(--ink); outline-offset:-2px; }
    .more:hover{ color:var(--ink); background:var(--bg-2); }
    .empty{ padding:48px 20px; text-align:center; color:var(--muted); border-top:1px solid var(--rule-strong); border-bottom:1px solid var(--rule-strong); }
    .empty code{ color:var(--ink); font-family:var(--mono); }
    body > footer{ padding-top:0; color:var(--faint); font:400 12px/1.6 var(--mono); }
    body > footer p{ margin:0; padding-top:14px; border-top:1px solid var(--rule); }
    @media (max-width:640px){ th.opt, td.opt{ display:none; } }

    /* ---- Phone. Rethought rather than shrunk: the ranking is what people come for, so everything above it
       gets shorter, every control fits a thumb (44px), nothing scrolls sideways except rows that are meant
       to, and the table loses columns instead of width. ---- */
    @media (max-width:640px)
    {
        main{ padding:20px max(14px, env(safe-area-inset-right)) max(40px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left)); }
        body > footer{ padding:0 max(14px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left)); }
        .mast{ padding-bottom:14px; margin-bottom:16px; }
        .kicker{ font-size:10px; margin-bottom:8px; }
        h1 span{ font-size:.28em; letter-spacing:.12em; }
        .bar{ gap:6px 18px; }
        .hint{ font-size:12px; }

        /* group / destination: one row that scrolls, snapping column by column, instead of a tall stack */
        .groups{ display:flex; gap:0; overflow-x:auto; scroll-snap-type:x mandatory; margin:0 -14px 18px; padding:0 14px; background:none; scrollbar-width:none; }
        .group:first-child{ box-shadow:none; }
        .groups::-webkit-scrollbar{ display:none; }
        .group{ flex:0 0 auto; width:min(72%, 240px); scroll-snap-align:start; padding:12px 14px; }
        .group b{ font-size:34px; }
        .group span{ font-size:12px; }

        /* the rankings scroll sideways if they do not fit */
        .tabs{ display:flex; width:100%; overflow-x:auto; scrollbar-width:none; }
        .tabs::-webkit-scrollbar{ display:none; }
        .tabs button{ flex:0 0 auto; min-height:44px; display:flex; align-items:center; padding:0; }
        #views button, #comms button{ flex:0 0 auto; }
        #comms{ flex-wrap:nowrap; }

        /* 16px keeps iOS from zooming into the field */
        input[type=search]{ flex:1 1 100%; min-height:44px; font-size:16px; }
        label.check{ min-height:44px; }

        .chips{ flex-wrap:nowrap; overflow-x:auto; margin:0 -14px 14px; padding:0 14px 4px; scrollbar-width:none; }
        .chips::-webkit-scrollbar{ display:none; }
        .chip{ flex:0 0 auto; display:flex; align-items:center; min-height:40px; padding:0 12px; }

        /* the table keeps three columns: rank, player (with alliance, universe and original position
           under the name) and points */
        th.wide, td.wide{ display:none; }
        td.name .meta{ display:block; margin-top:3px; font-weight:400; font-size:13px; color:var(--muted); white-space:normal; }
        td.name .meta em{ font:400 12px var(--mono); font-style:normal; color:var(--faint); white-space:nowrap; }
        th, td{ padding:10px 8px; }
        td.rank{ padding-right:10px; }
        th.c-rank{ width:46px; } th.c-pts{ width:150px; }
        tr.podium td.rank{ font-size:28px; }
        tr.podium td.name{ font-size:16px; }
        td.name{ white-space:normal; overflow-wrap:anywhere; }
        td.num{ font-size:13px; }
        /* scores reach hundreds of billions in the fast universes: smaller rather than cut */
        td.points{ font-size:12px; text-overflow:clip; }
        .ships{ display:block; margin-top:3px; font-size:11.5px; color:var(--faint); }
        .spec summary em{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .specToggle::after{ content:attr(data-short); }
        .more{ min-height:48px; }
    }
    @media (min-width:641px){ .ships{ display:none; } }
    /* a phone held sideways: little height, so the header shrinks and the settings cards stay closed */
    @media (max-height:500px)
    {
        main{ padding-top:14px; }
        .hint, .kicker{ display:none; }
        h1{ font-size:52px; }
        .mast{ padding-bottom:10px; margin-bottom:12px; }
        .groups{ margin-bottom:12px; }
        .group{ padding:8px 14px; }
        .group b{ font-size:28px; margin:4px 0 5px; }
        .group > span:last-child{ display:none; }
        .specs{ margin-bottom:12px; }
        .spec{ padding:4px 0; }
        .spec[open]{ padding-bottom:12px; }
        .spec summary em{ display:none; }
        input[type=search]{ min-width:140px; }
        .bar{ gap:6px 16px; margin-bottom:8px; }
    }
    /* touch at any width (a phone held sideways is wider than 640px): thumb-sized controls, and 16px in the
       search field so iOS does not zoom */
    @media (pointer:coarse)
    {
        .tabs button{ min-height:44px; display:inline-flex; align-items:center; }
        .chip{ min-height:40px; display:inline-flex; align-items:center; padding:0 12px; }
        input[type=search]{ min-height:44px; font-size:16px; }
        label.check{ min-height:44px; }
        .more{ min-height:48px; }
    }
</style>
</head>
<body>
<main>
    <header class="mast">
        <a class="home" id="home" href="https://ovalue.net/">← OValue</a>
        <p class="kicker" id="kicker">OGame · 2026</p>
        <h1>Exodus <span id="subtitle"></span></h1>
        <div class="tabs lang" id="lang" role="group" aria-label="Lingua / Language"><button data-lang="it">IT</button><button data-lang="en">EN</button></div>
    </header>

    <div class="bar">
        <div class="tabs" id="comms" role="group" aria-label="Community"></div>
    </div>
    <div class="bar">
        <div class="tabs" id="views" role="group">
            <button data-view="group"></button>
            <button data-view="destination"></button>
        </div>
        <span class="hint" id="hint"></span>
    </div>

    <div class="groups" id="groups" role="group"></div>
    <div class="specs" id="specs"></div>

    <div class="bar controls">
        <div class="tabs" id="tabs" role="group"></div>
    </div>
    <div class="bar">
        <input type="search" id="search">
        <label class="check"><input type="checkbox" id="active"> <span id="activeText"></span></label>
        <label class="check"><input type="checkbox" id="vacation"> <span id="vacationText"></span></label>
    </div>

    <div class="chips" id="chips" role="group"></div>
    <h2 class="sr" id="rankingHead"></h2>
    <p class="summary" id="summary" aria-live="polite"></p>
    <div id="table"></div>
</main>
<footer><p id="footer"></p></footer>

<script>
addEventListener('DOMContentLoaded', () =>
{
    'use strict';

    const $ = id => document.getElementById(id);

    // Every word on the page, in Italian and English. The language comes from the address (?lang=en), then the
    // last one chosen, then the browser: Italian for Italian browsers, English for everyone else.
    const TEXT =
    {
        it:
        {
            locale:'it-IT', kicker:'Fusioni 2026', subtitle:'unione classifiche', back:'Torna a OValue', noData:'Nessun dato. Esegui <code>node fetch.mjs</code> e ricarica la pagina.',
            views:'Unisci per', byGroup:'Per gruppo', byDestination:'Per destinazione', merged:'Classifica unita', ranking:'Classifica', universesLabel:'Universi',
            search:'Cerca giocatore o alleanza', hideInactive:'Nascondi inattivi e bannati', hideVacation:'Nascondi in vacanza',
            categories:{ total:'Generale', economy:'Economia', research:'Ricerca', military:'Militare', lifeform:'Forme di vita' },
            flags:{ v:'in vacanza', i:'inattivo da 7 giorni', I:'inattivo da 28 giorni', b:'bannato', o:'fuorilegge' },
            colors:{ blue:'Blu', orange:'Arancio', green:'Verde', purple:'Viola', pink:'Rosa' },
            uk:'Regno Unito (EN)', universe:n => `Universo ${n}`,
            groupLabel:name => `del gruppo ${name}`, destinationLabel:name => `di ${name}`, groupOf:(name, community) => `gruppo ${name}${community ? ' ' + community : ''}`,
            destinations:'Destinazioni', from:'Da', existing:'esistente', new:'nuovo', destinationChip:'destinazione',
            count:(u, p) => `${u} ${u === 1 ? 'universo' : 'universi'}, ${p} giocatori`,
            hints:
            {
                group:'Gli universi del gruppo e le destinazioni che esistono già: ogni giocatore compare una volta.',
                destination:'Tutti i giocatori che possono scegliere quella destinazione, più quelli dell\'universo stesso se esiste già: chi ha più destinazioni compare in ognuna.',
            },
            spec:{ show:'Mostra caratteristiche', showShort:'Mostra', close:'Chiudi', peaceful:'pacifica', hostile:'ostile', holding:'staz.', fields:'campi', dm:'MO',
                fromApi:'universo esistente: impostazioni attuali, dall\'API del server', changed:list => `universo esistente: impostazioni attuali dall'API, con le modifiche annunciate per la fusione (${list})` },
            specFields:{ economy:'Economia', research:'Ricerca', peaceful:'Flotta pacifica', holding:'Stazionamento', hostile:'Flotta ostile', galaxies:'Galassie',

        'RU 1':   { peaceful:'x4', debris:'70%' },
    };
    const speed = text => Number(String(text).slice(1));
    const current = n =>
    {
        const now = data.universes[n]?.settings;
        if(!now) return null;
        const change = CHANGES[n] || {};
        const research = change.economy ? `x${speed(now.research) / speed(now.economy) * speed(change.economy)}` : now.research;
        return { ...now, research, ...change };
    };
    // dark matter always with its thousands separator: Intl leaves 8000 bare in Italian and Spanish
    const specValue = (spec, key) => key === 'deut' ? fmt.format(spec.deut) + 'x' : key === 'dm' ? new Intl.NumberFormat(t.locale, { useGrouping:'always' }).format(spec.dm) : spec[key];

    // the destinations relevant to what is selected: the one chosen, or the ones a group can move to
    const renderSpecs = () =>
    {
        const names = state.view === 'destination' ? [state.set] : data.communities[state.community].find(g => g.id === state.set).destinations;
        // announced settings for a new universe; for one that already exists, today's plus the announced changes
        const specOf = n => SPECS[n] || current(n);
        $('specs').innerHTML = names.filter(specOf).map(n =>
        {
            const spec = specOf(n);
            const changed = Object.keys(CHANGES[n] || {}).map(key => `${t.specFields[key]} ${spec[key]}`).join(', ');
            const switches = SPEC_SWITCHES.filter(key => key in spec).map(key => `${t.specSwitches[key]} ${spec[key] ? 'ON' : 'OFF'}`).join(' · ') +
                (SPECS[n] ? '' : ` · ${changed ? t.spec.changed(changed) : t.spec.fromApi}`);
            // closed by default everywhere, so the ranking stays near the top. The summary says what is
            // inside and carries what sets the destinations apart (fleet speeds, holding, fields, dark matter).
            return `<details class="spec"><summary><span class="specHead"><span class="specTitle"><b>${esc(destinationName(n))}</b>${spec.style ? ` <span>${esc(spec.style)}</span>` : ''}</span>` +
                `<em>${['peaceful', 'hostile', 'holding', 'fields', 'dm'].filter(key => key in spec).map(key => `${t.spec[key]} ${esc(specValue(spec, key))}`).join(' · ')}</em></span>` +
                `<i class="specToggle" data-show="${esc(t.spec.show)}" data-short="${esc(t.spec.showShort)}" data-close="${esc(t.spec.close)}"></i></summary><dl>` +
                SPEC_FIELDS.filter(key => key in spec).map(key => `<div><dt>${t.specFields[key]}</dt><dd>${esc(specValue(spec, key))}</dd></div>`).join('') +
                `</dl><p class="specCommon">${esc(switches)}</p></details>`;
        }).join('');
    };

    // the community comes from the address (?c=IT), so a link opens on the same one
    const asked = (new URLSearchParams(location.search).get('c') || '').toUpperCase();
    const state = { community:communities.includes(asked) ? asked : communities.includes('IT') ? 'IT' : communities[0],
        view:'group', set:null, category:'total', query:'', activeOnly:false, hideVacation:false, hidden:new Set(), shown:PAGE };
    let SETS = setsFor(state.community);
    state.set = SETS.group[0].id;

    const group = () => SETS[state.view].find(s => s.id === state.set);

    const setAddress = (key, value) =>
    {
        const url = new URL(location.href);
        url.searchParams.set(key, value);
        history.replaceState(null, '', url);
    };

    const renderCommunities = () =>
    {
        $('comms').innerHTML = communities.map(c => `<button data-c="${c}" title="${esc(country(c))}" aria-label="${esc(country(c))}" aria-pressed="${c === state.community}">${c}</button>`).join('');
        $('kicker').textContent = `OGame ${country(state.community)} · ${t.kicker}`;
        $('comms').querySelector('[aria-pressed="true"]')?.scrollIntoView({ block:'nearest', inline:'nearest' });
    };

    const renderGroups = () =>
    {
        $('views').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.view === state.view));
        $('hint').textContent = t.hints[state.view];
        $('groups').innerHTML = SETS[state.view].map(s =>
        {
            const count = s.universes.reduce((sum, n) => sum + (data.universes[n]?.players || 0), 0);
            // a destination fed by several groups gets a bar split in their colours, dimmed for other communities
            const shares = s.swatches.map(w => w.foreign ? `color-mix(in srgb, ${w.color} 40%, var(--bg))` : w.color);
            const bar = shares.length > 1 ? `linear-gradient(90deg,${shares.map((c, i) => `${c} ${i * 100 / shares.length}% ${(i + 1) * 100 / shares.length}%`).join(',')})` : shares[0];
            return `<button class="group" style="--c:${s.colors[0]};--bar:${bar}" data-id="${esc(s.id)}" aria-pressed="${s.id === state.set}">` +
                `<b><span class="sw" aria-hidden="true">${s.swatches.map(w => `<i${w.foreign ? ' class="foreign"' : ''} style="--sw:${w.color}"></i>`).join('')}</span>${esc(s.name)}</b>` +
                `<span>${s.server ? esc(s.server) + ' · ' : ''}${t.count(s.universes.length, fmt.format(count))}</span>` +
                `<span>${esc(s.note)}</span></button>`;
        }).join('');
        document.documentElement.style.setProperty('--group', group().colors[0]);
        // on a phone the cards are a sideways strip: keep the chosen one on screen
        $('groups').querySelector('[aria-pressed="true"]')?.scrollIntoView({ block:'nearest', inline:'nearest' });
    };

    const renderTabs = () =>
    {
        $('tabs').innerHTML = CATEGORIES.map(c => `<button data-key="${c.key}" style="--cat:${c.color};--cat-ink:${c.ink}" aria-pressed="${c.key === state.category}">${t.categories[c.key]}</button>`).join('');
    };

    // in the group view an existing destination is marked as such
    const renderChips = () =>
    {
        $('chips').innerHTML = group().universes.map(n =>
        {
            const label = esc(tag(n)) + (state.view === 'group' && existing(n) ? ` · ${t.destinationChip}` : '');
            if(!data.universes[n] || failed.has(n)) return `<button class="chip gone" disabled title="${t.unavailable}">${esc(universeName(n))}<small>${label}</small></button>`;
            return `<button class="chip" data-n="${esc(n)}" aria-pressed="${!state.hidden.has(n)}">${esc(universeName(n))}<small>${label}</small></button>`;
        }).join('');
    };

    const rows = () =>
    {
        const category = CATEGORIES.find(c => c.key === state.category);
        const query = state.query.trim().toLowerCase();
        const list = [];

        for(const n of group().universes)
        {
            if(state.hidden.has(n) || !players[n]) continue;
            const universe = { name:universeName(n), number:tag(n) };

            for(const p of players[n])
            {
                if(state.activeOnly && /[iIb]/.test(p[2])) continue;
                if(state.hideVacation && p[2].includes('v')) continue;
                list.push({ p, universe });
            }
        }

        // the merged order: score first, then the original position as a stable tie-break
        list.sort((a, b) => b.p[category.score] - a.p[category.score] || a.p[category.pos] - b.p[category.pos]);
        list.forEach((row, index) => row.rank = index + 1);

        const filtered = query ? list.filter(({ p }) => p[1].toLowerCase().includes(query) || p[3].toLowerCase().includes(query)) : list;
        return { category, all:list.length, list:filtered };
    };

    const renderTable = () =>
    {
        // the players of the universes not loaded yet first; the table follows once they are in
        if(!group().universes.every(ready))
        {
            $('summary').textContent = '';
            $('table').innerHTML = `<div class="empty">${t.loading}</div>`;
            Promise.all(group().universes.map(load)).then(() => { renderChips(); renderTable(); renderFooter(); });
            return;
        }

        const { category, all, list } = rows();
        const shown = list.slice(0, state.shown);

        $('summary').textContent = state.query
            ? t.results(fmt.format(list.length), fmt.format(all))
            : t.summary(fmt.format(all), t.categories[category.key], group().label);

        if(!list.length)
        {
            $('table').innerHTML = `<div class="empty">${t.noMatch}</div>`;
            return;
        }

        const flags = status => Array.from(status).filter(f => t.flags[f]).map(f => `<span class="flag ${f}" title="${t.flags[f]}">${f}</span>`).join('');

        $('table').innerHTML =
            `<table><thead><tr><th class="num c-rank">#</th><th>${t.head.player}</th><th class="wide c-ally">${t.head.alliance}</th><th class="wide c-uni">${t.head.universe}</th>` +
            `<th class="num opt c-pos" title="${t.head.posTitle}">${t.head.pos}</th><th class="num c-pts">${t.head.points}</th>${category.ships ? `<th class="num opt c-ships">${t.head.ships}</th>` : ''}</tr></thead><tbody>` +
            shown.map(({ p, universe, rank }) =>
                `<tr class="${rank <= 3 ? 'top podium' : rank <= 10 ? 'top' : ''}"><td class="num rank">${rank}</td>` +
                `<td class="name">${esc(p[1])}${flags(p[2])}<span class="meta">${p[3] ? esc(p[3]) + ' · ' : ''}${esc(universe.name)} <em>` +
                esc([universe.number, p[category.pos] ? fmt.format(p[category.pos]) + '°' : ''].filter(Boolean).join(', ')) + `</em></span></td>` +
                `<td class="ally wide">${p[3] ? esc(p[3]) : ''}</td>` +
                `<td class="uni wide">${esc(universe.name)}<em>${esc(universe.number)}</em></td>` +
                `<td class="num opt">${p[category.pos] ? fmt.format(p[category.pos]) : ''}</td>` +
                `<td class="num points">${fmt.format(p[category.score])}` +
                (category.ships ? `<span class="ships">${t.ships(fmt.format(p[category.ships]))}</span>` : '') + `</td>` +
                (category.ships ? `<td class="num opt">${fmt.format(p[category.ships])}</td>` : '') + `</tr>`).join('') +
            `</tbody></table>` +
            (list.length > shown.length ? `<button class="more" id="more">${t.more(fmt.format(Math.min(PAGE, list.length - shown.length)), fmt.format(list.length - shown.length))}</button>` : '');
    };

    const renderFooter = () =>
    {
        const stamps = group().universes.map(n => data.universes[n]?.updated).filter(Boolean);
        const when = time => new Date(time).toLocaleString(t.locale, { dateStyle:'short', timeStyle:'short' });
        const gone = group().universes.filter(n => !data.universes[n] || failed.has(n));
        $('footer').textContent = (stamps.length ? t.updated(when(Math.min(...stamps) * 1000), when(Math.max(...stamps) * 1000)) : '') +
            (gone.length ? t.gone(gone.join(', ')) : '') + t.fetched(when(data.generatedAt)) + t.admins;
    };

    const render = () => { renderCommunities(); renderGroups(); renderSpecs(); renderTabs(); renderChips(); renderTable(); renderFooter(); };

    $('lang').addEventListener('click', e =>
    {
        const button = e.target.closest('button');
        if(!button || button.dataset.lang === lang) return;
        setLanguage(button.dataset.lang);
        store.set('exodus-lang', lang);
        setAddress('lang', lang);
        SETS = setsFor(state.community);
        render();
    });
    $('comms').addEventListener('click', e =>
    {
        const button = e.target.closest('button');
        if(!button || button.dataset.c === state.community) return;
        state.community = button.dataset.c; SETS = setsFor(state.community);
        state.set = SETS[state.view][0].id; state.hidden.clear(); state.shown = PAGE;
        setAddress('c', state.community);
        render();
    });
    $('views').addEventListener('click', e =>
    {
        const button = e.target.closest('button');
        if(!button || button.dataset.view === state.view) return;
        state.view = button.dataset.view; state.set = SETS[state.view][0].id; state.hidden.clear(); state.shown = PAGE;
        render();
    });
    $('groups').addEventListener('click', e =>
    {
        const button = e.target.closest('.group');
        if(!button) return;
        state.set = button.dataset.id; state.hidden.clear(); state.shown = PAGE;
        render();
    });
    $('tabs').addEventListener('click', e =>
    {
        const button = e.target.closest('button');
        if(!button) return;
        state.category = button.dataset.key; state.shown = PAGE;
        renderTabs(); renderTable();
    });
    $('chips').addEventListener('click', e =>
    {
        const button = e.target.closest('.chip');
        if(!button || button.disabled) return;
        const n = button.dataset.n;
        if(state.hidden.has(n)) state.hidden.delete(n);
        else if(state.hidden.size < group().universes.filter(u => players[u]).length - 1) state.hidden.add(n); // at least one stays
        state.shown = PAGE;
        renderChips(); renderTable();
    });
    $('search').addEventListener('input', e => { state.query = e.target.value; state.shown = PAGE; renderTable(); });
    $('active').addEventListener('change', e => { state.activeOnly = e.target.checked; state.shown = PAGE; renderTable(); });
    $('vacation').addEventListener('change', e => { state.hideVacation = e.target.checked; state.shown = PAGE; renderTable(); });
    $('table').addEventListener('click', e => { if(e.target.id === 'more') { state.shown += PAGE; renderTable(); } });

    render();
});
</script>
</body>
</html>
